name: Rook

options:
  bundleIdPrefix: com.rookfitness
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  RookKit:
    path: RookKit
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    exactVersion: 2.61.0  # 2.62+ needs a newer Swift compiler than Xcode 16.3 ships

targets:
  Rook:
    type: application
    platform: iOS
    sources:
      - path: Rook
      - path: Shared
    dependencies:
      - target: RookLiveActivity
      - package: RookKit
        products: [RookModels, RookFormatting, RookNetworking, RookSession, RookAuth, RookFeatures, RookLiveActivityKit, RookWidgetData]
      - package: Amplify
        products: [Amplify, AWSCognitoAuthPlugin]
    info:
      path: Rook/Resources/Info.plist
      properties:
        CFBundleDisplayName: Rook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: Rook uses Face ID to unlock the app when you turn on biometric unlock.
        NSMotionUsageDescription: Rook shows your step count for today on the dashboard.
        NSSupportsLiveActivities: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Wordmark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        RookAPIBaseURL: $(ROOK_API_BASE_URL)
        RookAIStreamURL: $(ROOK_AI_STREAM_URL)
        RookCognitoUserPoolID: $(ROOK_COGNITO_USER_POOL_ID)
        RookCognitoClientID: $(ROOK_COGNITO_CLIENT_ID)
        RookCognitoRegion: $(ROOK_COGNITO_REGION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookfitness.app
        PRODUCT_NAME: Rook
        CODE_SIGN_ENTITLEMENTS: Rook/Resources/Rook.entitlements
        # Simulator builds are signed locally ("Sign to Run Locally") so entitlements, and with them
        # Keychain access, are always present, even without an Apple Developer account in Xcode.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  RookLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RookLiveActivity
      - path: Shared
    dependencies:
      - package: RookKit
        products: [RookLiveActivityKit, RookWidgetData]
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: RookLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Rook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMotionUsageDescription: Rook shows your step count for today in its widgets.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookfitness.app.LiveActivity
        PRODUCT_NAME: RookLiveActivity
        CODE_SIGN_ENTITLEMENTS: RookLiveActivity/RookLiveActivity.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  RookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RookTests
    dependencies:
      - target: Rook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookfitness.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  RookUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RookUITests
    dependencies:
      - target: Rook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rookfitness.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: Rook

schemes:
  Rook:
    build:
      targets:
        Rook: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [Rook]
      targets:
        - RookTests
        - RookUITests
    archive:
      config: Release
